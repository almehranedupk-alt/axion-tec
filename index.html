    <section id="contact" style="padding: 100px 5%; background-color: #1a252f;">
        <div class="section-title">
            <h2>Contact Us</h2>
            <p style="text-align: center; color: var(--silver);">Have a project in mind? Let's build it together.</p>
        </div>
        
        <div style="max-width: 600px; margin: 0 auto; background: var(--dark-bg); padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
            <form action="https://formspree.io/f/xyzkpvbl" method="POST">
                <div style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 8px; color: var(--accent-blue);">Full Name</label>
                    <input type="text" name="name" required style="width: 100%; padding: 12px; border-radius: 5px; border: 1px solid var(--silver); background: transparent; color: white;">
                </div>
                
                <div style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 8px; color: var(--accent-blue);">Email Address</label>
                    <input type="email" name="_replyto" required style="width: 100%; padding: 12px; border-radius: 5px; border: 1px solid var(--silver); background: transparent; color: white;">
                </div>
                
                <div style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 8px; color: var(--accent-blue);">Your Message (School/Business Requirement)</label>
                    <textarea name="message" rows="5" required style="width: 100%; padding: 12px; border-radius: 5px; border: 1px solid var(--silver); background: transparent; color: white;"></textarea>
                </div>
                
                <button type="submit" class="btn-main" style="width: 100%; border: none; cursor: pointer;">Send Message</button>
            </form>
        </div>
    </section>
